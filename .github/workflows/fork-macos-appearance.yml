name: Fork macOS native appearance qualification
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Public fork contribution branch or exact commit
        default: 153cefc05757e154fe5de465457810f823b64911
        type: string
      baseline_ref:
        description: Clean upstream baseline commit
        default: ff6b01fbe4cc55f65e891cb786b84489ab41d781
        type: string
  push:
    branches: [codex/fork-macos-appearance-ci]
    paths: [.github/fork-tools/macos-appearance/**, .github/workflows/fork-macos-appearance.yml]
permissions:
  contents: read
concurrency:
  group: fork-macos-appearance-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    if: github.repository == 'StavenCross/kyllene'
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, candidate]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: StavenCross/kyllene
          ref: ${{ matrix.variant == 'baseline' && (inputs.baseline_ref || 'ff6b01fbe4cc55f65e891cb786b84489ab41d781') || (inputs.source_ref || '153cefc05757e154fe5de465457810f823b64911') }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: StavenCross/kyllene
          ref: ${{ inputs.source_ref || '153cefc05757e154fe5de465457810f823b64911' }}
          path: contract
          sparse-checkout: desktopApp/tests
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: jetbrains
          java-version: '25'
          java-package: jdk+jcef
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - name: Fork Mac probe contracts
        working-directory: tooling
        run: python3 -m unittest discover -s .github/fork-tools/macos-appearance/tests
      - name: Build unsigned release application and desktop tests
        working-directory: source
        env:
          HERALD_PACKAGING_JDK: ${{ env.JAVA_HOME }}
        run: ./gradlew --no-daemon --continue :desktopApp:jvmTest :desktopApp:createReleaseDistributable
      - name: Qualify native appearance
        if: ${{ !cancelled() }}
        env:
          VARIANT: ${{ matrix.variant }}
          LAUNCHER_CHECK: contract/desktopApp/tests/check_macos_launcher.py
        run: python3 tooling/.github/fork-tools/macos-appearance/qualify.py source "$VARIANT" report
      - name: Qualification reports and synthetic screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: macos-appearance-${{ matrix.variant }}
          path: |
            report/qualification.json
            report/*.jpg
            report/app-*/*.jpg
            report/app-*/application.json
            report/app-*/application-report.txt
          if-no-files-found: error
